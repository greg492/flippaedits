[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lacrosse-reel-editor"
version = "0.1.0"
description = "Transform raw lacrosse footage into client-ready social media reels"
requires-python = ">=3.10"
dependencies = [
    "av>=16.1.0",
    "PySide6>=6.10.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
lacrosse-reel = "src.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
